<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tecnican Service Agent</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Tecnican connection">
        <div class="brand">
          <span class="mark" aria-hidden="true">T</span>
          <div>
            <h1>Tecnican</h1>
            <p id="connectionStatus">Desconectado</p>
          </div>
        </div>

        <form id="loginForm" class="login">
          <label>
            <span>GLPI</span>
            <input id="baseUrl" name="baseUrl" type="url" placeholder="https://glpi.example.com" required>
          </label>
          <label>
            <span>Usuario</span>
            <input id="username" name="username" autocomplete="username" required>
          </label>
          <label>
            <span>Senha</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="primary">Conectar</button>
          <button type="button" id="notificationButton" class="ghost" hidden title="Ativar notificacoes">Avisos</button>
          <button type="button" id="logoutButton" class="ghost" hidden>Sair</button>
        </form>
      </section>

      <section class="timerBand" aria-label="Current timer">
        <div>
          <p class="eyebrow">Sessao em foco</p>
          <h2 id="focusTicket">Nenhuma sessao rodando</h2>
        </div>
        <div class="clock" id="focusTimer">00:00:00</div>
      </section>

      <section class="statsBand" aria-label="Work summary">
        <div>
          <span id="slotCount">0/3</span>
          <p>Slots rodando</p>
        </div>
        <div>
          <span id="openSessionCount">0</span>
          <p>Sessoes abertas</p>
        </div>
        <div>
          <span id="totalElapsed">00:00:00</span>
          <p>Tempo aberto</p>
        </div>
      </section>

      <section class="workspace">
        <section class="panel activePanel" aria-labelledby="activeTitle">
          <div class="panelHeader">
            <div>
              <p class="eyebrow">Timers</p>
              <h2 id="activeTitle">Sessoes ativas</h2>
            </div>
            <button type="button" id="refreshButton" class="iconButton" title="Atualizar">↻</button>
          </div>
          <div id="activeSessions" class="sessionList"></div>
          <div class="subsectionHeader">
            <div>
              <p class="eyebrow">Historico</p>
              <h3>Atendimentos recentes</h3>
            </div>
          </div>
          <div id="sessionHistory" class="historyList"></div>
        </section>

        <section class="panel queuePanel" aria-labelledby="queueTitle">
          <div class="panelHeader">
            <div>
              <p class="eyebrow">GLPI</p>
              <h2 id="queueTitle">Minha fila</h2>
            </div>
            <div class="queueStatus">
              <span id="syncStatus" class="syncStatus">Aguardando conexao</span>
              <span id="queueCount" class="count">0</span>
            </div>
          </div>
          <div class="queueTools">
            <label>
              <span>Buscar</span>
              <input id="queueSearch" type="search" placeholder="Ticket, numero ou prioridade">
            </label>
            <label>
              <span>Filtro</span>
              <select id="queueFilter">
                <option value="all">Todos</option>
                <option value="direct">Diretos</option>
                <option value="group">Grupos</option>
                <option value="available">Disponiveis</option>
              </select>
            </label>
            <label>
              <span>Atualizacao</span>
              <select id="queueInterval">
                <option value="30000">30 segundos</option>
                <option value="60000" selected>1 minuto</option>
                <option value="120000">2 minutos</option>
                <option value="180000">3 minutos</option>
                <option value="240000">4 minutos</option>
                <option value="300000">5 minutos</option>
              </select>
            </label>
          </div>
          <div id="ticketQueue" class="ticketList"></div>
        </section>
      </section>
    </main>

    <dialog id="finishDialog">
      <form method="dialog" id="finishForm" class="dialogForm">
        <h2>Finalizar sessao</h2>
        <label>
          <span>Descricao do atendimento</span>
          <textarea id="finishDescription" rows="5" required></textarea>
        </label>
        <label class="checkLabel">
          <input id="finishSolveTicket" type="checkbox">
          <span>Solucionar o chamado no GLPI</span>
        </label>
        <menu>
          <button value="cancel" class="ghost">Cancelar</button>
          <button value="default" class="primary">Finalizar</button>
        </menu>
      </form>
    </dialog>

    <dialog id="suspendDialog">
      <form method="dialog" id="suspendForm" class="dialogForm">
        <h2>Suspender sessao</h2>
        <label>
          <span>Motivo</span>
          <select id="suspendReason">
            <option value="aguardando_cliente">Aguardando cliente</option>
            <option value="aguardando_acesso">Aguardando acesso</option>
            <option value="aguardando_fornecedor">Aguardando fornecedor</option>
            <option value="aguardando_equipamento">Aguardando equipamento</option>
            <option value="aguardando_terceiro">Aguardando terceiro</option>
            <option value="aguardando_aprovacao">Aguardando aprovacao</option>
            <option value="aguardando_janela_de_manutencao">Aguardando janela</option>
            <option value="outro">Outro</option>
          </select>
        </label>
        <label>
          <span>Detalhe</span>
          <textarea id="suspendText" rows="3"></textarea>
        </label>
        <menu>
          <button value="cancel" class="ghost">Cancelar</button>
          <button value="default" class="primary">Suspender</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
